<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Shivam Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #04080f;
      --blue:  #0a1628;
      --pink:  #f72585;
      --red:   #e63946;
      --white: #f0f6ff;
      --w60:   rgba(240,246,255,0.6);
      --glass: rgba(255,255,255,0.055);
      --gbdr:  rgba(255,255,255,0.11);
      --ff-h:  'Syne', sans-serif;
      --ff-m:  'Space Mono', monospace;
    }

    body {
      background: var(--ink);
      color: var(--white);
      font-family: var(--ff-h);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      animation: orbFloat 8s ease-in-out infinite;
    }
    body::before {
      width: 480px; height: 480px;
      background: rgba(247,37,133,0.14);
      top: -120px; left: -120px;
    }
    body::after {
      width: 360px; height: 360px;
      background: rgba(230,57,70,0.1);
      bottom: -100px; right: -80px;
      animation-delay: 4s;
    }
    @keyframes orbFloat {
      0%,100%{ transform: translate(0,0) scale(1); }
      50%     { transform: translate(24px,32px) scale(1.06); }
    }

    /* Particle canvas */
    #bg-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    .login-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      padding: 20px;
    }

    .login-card {
      background: var(--glass);
      border: 1px solid var(--gbdr);
      backdrop-filter: blur(24px) saturate(180%);
      border-radius: 24px;
      padding: 52px 44px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(247,37,133,0.08);
      animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardIn {
      0%  { transform: translateY(40px) scale(0.95); opacity: 0; }
      100%{ transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Groot avatar on top */
    .login-avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      margin: 0 auto 24px;
      background: radial-gradient(135deg, rgba(247,37,133,0.2), rgba(10,22,40,0.8));
      border: 2px solid rgba(247,37,133,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      position: relative;
      animation: avatarPulse 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(247,37,133,0.25);
    }
    @keyframes avatarPulse {
      0%,100%{ box-shadow: 0 0 30px rgba(247,37,133,0.25); }
      50%    { box-shadow: 0 0 55px rgba(247,37,133,0.55); }
    }

    .login-tag {
      text-align: center;
      font-family: var(--ff-m);
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: var(--pink);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: var(--ff-h);
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    h1 span {
      background: linear-gradient(120deg, var(--pink), var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-sub {
      text-align: center;
      color: var(--w60);
      font-size: 0.88rem;
      margin-bottom: 36px;
      font-family: var(--ff-m);
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-family: var(--ff-m);
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--w60);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: rgba(240,246,255,0.05);
      border: 1px solid rgba(240,246,255,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--white);
      font-family: var(--ff-m);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(247,37,133,0.15);
    }
    input::placeholder { color: rgba(240,246,255,0.25); }

    /* Password toggle */
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--w60); cursor: pointer;
      font-size: 1.1rem; padding: 4px;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--pink); }

    .error-msg {
      background: rgba(230,57,70,0.12);
      border: 1px solid rgba(230,57,70,0.35);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: var(--ff-m);
      font-size: 0.82rem;
      color: #ff8a92;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%    { transform: translateX(-8px); }
      40%    { transform: translateX(8px); }
      60%    { transform: translateX(-5px); }
      80%    { transform: translateX(5px); }
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--pink), var(--red));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: var(--ff-m);
      font-size: 0.85rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 32px rgba(247,37,133,0.4);
      margin-top: 8px;
    }
    .btn-login::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.18) 60%, transparent 90%);
      transform: translateX(-100%);
      transition: transform 0.45s ease;
    }
    .btn-login:hover::after { transform: translateX(100%); }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 0 55px rgba(247,37,133,0.65); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .btn-loading { display: inline-block; }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }
    .back-link a {
      font-family: var(--ff-m);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: var(--w60);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link a:hover { color: var(--pink); }

    /* Hint */
    .hint-box {
      background: rgba(247,37,133,0.06);
      border: 1px solid rgba(247,37,133,0.18);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: var(--ff-m);
      font-size: 0.75rem;
      color: rgba(247,37,133,0.75);
      margin-top: 20px;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-avatar">🌱</div>
    <p class="login-tag">// Admin Portal</p>
    <h1>Welcome Back,<br/><span>Shivam</span></h1>
    <p class="login-sub">Sign in to manage your portfolio projects</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="pwToggle" title="Toggle password visibility">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-loading">Sign In →</span>
      </button>
    </form>



    <div class="back-link">
      <a href="/">← Back to Portfolio</a>
    </div>
  </div>
</div>

<script>
  /* Particles */
  (function() {
    const c = document.getElementById('bg-canvas');
    const x = c.getContext('2d');
    let W, H, pts;
    function resize() {
      W = c.width = window.innerWidth;
      H = c.height = window.innerHeight;
      pts = Array.from({length: 60}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3,
        r: Math.random()*1.6+.4,
        col: Math.random()>.5 ? 'rgba(247,37,133,.5)' : 'rgba(160,200,255,.25)'
      }));
    }
    resize();
    window.addEventListener('resize', resize);
    function draw() {
      x.clearRect(0,0,W,H);
      pts.forEach(p => {
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=W; if(p.x>W)p.x=0;
        if(p.y<0)p.y=H; if(p.y>H)p.y=0;
        x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2);
        x.fillStyle=p.col; x.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  })();

  /* Password toggle */
  document.getElementById('pwToggle').addEventListener('click', function() {
    const pw = document.getElementById('password');
    const showing = pw.type === 'text';
    pw.type = showing ? 'password' : 'text';
    this.textContent = showing ? '👁' : '🙈';
  });

  /* Login form */
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';

    btn.disabled = true;
    btn.querySelector('.btn-loading').textContent = 'Signing in...';

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (data.success) {
        btn.querySelector('.btn-loading').textContent = '✓ Success!';
        setTimeout(() => window.location.href = '/admin', 500);
      } else {
        err.textContent = data.message || 'Login failed. Please try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.querySelector('.btn-loading').textContent = 'Sign In →';
      }
    } catch (e) {
      err.textContent = 'Connection error. Is the server running?';
      err.style.display = 'block';
      btn.disabled = false;
      btn.querySelector('.btn-loading').textContent = 'Sign In →';
    }
  });
</script>
</body>
</html>
